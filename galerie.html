<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Œuvres — Mahé Barbry</title>
  <meta name="description" content="Catalogue complet des œuvres de Mahé Barbry, artiste peintre.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Jost:wght@300;400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <nav class="nav nav--solid" id="nav">
    <div class="nav__inner">
      <a href="index.html" class="nav__name">Mahé Barbry</a>
      <ul class="nav__links">
        <li><a href="galerie.html"  class="nav__link nav__link--active">Œuvres</a></li>
        <li><a href="a-propos.html" class="nav__link">À propos</a></li>
        <li><a href="contact.html"  class="nav__link">Contact</a></li>
      </ul>
      <button class="nav__toggle" id="navToggle" aria-label="Menu">Menu</button>
    </div>
  </nav>

  <div class="nav-overlay" id="navOverlay">
    <button class="nav-overlay__close" id="navClose">Fermer</button>
    <a href="galerie.html"  class="nav-overlay__link">Œuvres</a>
    <a href="a-propos.html" class="nav-overlay__link">À propos</a>
    <a href="contact.html"  class="nav-overlay__link">Contact</a>
  </div>

  <header class="gallery-header page-top">
    <p class="label">Catalogue complet</p>
    <h1 class="gallery-header__title">Œuvres</h1>
  </header>

  <div class="gallery-count">
    <p class="label" id="galleryCount">Chargement…</p>
  </div>

  <main class="gallery-grid" id="galleryGrid"></main>

  <script type="module">
    import { getArtworks, renderGalleryGrid } from './js/content.js';
    try {
      const artworks = await getArtworks();
      const years = artworks.map(a => a.year).sort();
      document.getElementById('galleryCount').textContent =
        `${artworks.length} œuvre${artworks.length > 1 ? 's' : ''} · ${years[0]} – ${years[years.length - 1]}`;
      renderGalleryGrid(artworks, document.getElementById('galleryGrid'));
    } catch(e) {
      document.getElementById('galleryCount').textContent = 'Erreur : ' + e.message;
      console.error('getArtworks error:', e);
    }
  </script>

  <footer class="footer">
    <div class="footer__inner">
      <span class="footer__name">Mahé Barbry</span>
      <nav class="footer__nav">
        <a href="galerie.html">Œuvres</a>
        <a href="a-propos.html">À propos</a>
        <a href="contact.html">Contact</a>
      </nav>
      <span class="footer__copy">© 2025 Mahé Barbry · <a href="/admin/" style="opacity:.4;font-size:.85em;">Admin</a></span>
    </div>
  </footer>

  <script src="js/main.js"></script>
  <!-- module script above handles gallery rendering -->
</body>
</html>
