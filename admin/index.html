<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — Mahé Barbry</title>
</head>
<body>
  <script>
    // Poll localStorage for token (popup can't use postMessage due to GitHub's COOP headers)
    var _authPoll = setInterval(function() {
      var stored = localStorage.getItem('decap_token');
      if (!stored) return;
      try {
        var data = JSON.parse(stored);
        if (Date.now() - data.ts > 60000) { localStorage.removeItem('decap_token'); return; }
        localStorage.removeItem('decap_token');
        clearInterval(_authPoll);
        // Signal popup it can close
        localStorage.setItem('decap_token_received', '1');
        // Dispatch the auth message to Decap while popup is still open
        window.dispatchEvent(new MessageEvent('message', {
          data: 'authorization:github:success:' + JSON.stringify({ token: data.token, provider: 'github' }),
          origin: window.location.origin
        }));
      } catch(e) {}
    }, 200);
  </script>
  <script src="https://unpkg.com/decap-cms@^3.3.3/dist/decap-cms.js"></script>
</body>
</html>
