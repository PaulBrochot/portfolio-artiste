<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>À propos — Mahé Barbry</title>
  <meta name="description" content="Démarche et biographie de Mahé Barbry, artiste peintre.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Jost:wght@300;400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ── NAVIGATION ── -->
  <nav class="nav nav--solid" id="nav">
    <div class="nav__inner">
      <a href="index.html" class="nav__name">Mahé Barbry</a>
      <ul class="nav__links">
        <li><a href="galerie.html"  class="nav__link">Œuvres</a></li>
        <li><a href="a-propos.html" class="nav__link nav__link--active">À propos</a></li>
        <li><a href="contact.html"  class="nav__link">Contact</a></li>
      </ul>
      <button class="nav__toggle" id="navToggle" aria-label="Menu">Menu</button>
    </div>
  </nav>

  <div class="nav-overlay" id="navOverlay">
    <button class="nav-overlay__close" id="navClose">Fermer</button>
    <a href="galerie.html"  class="nav-overlay__link">Œuvres</a>
    <a href="a-propos.html" class="nav-overlay__link">À propos</a>
    <a href="contact.html"  class="nav-overlay__link">Contact</a>
  </div>

  <!-- ── HERO ── -->
  <section class="about-hero page-top" id="aboutHero">
    <div class="about-hero__image">
      <img id="aboutPortrait" src="images/portrait.jpg" alt="Mahé Barbry" loading="eager">
    </div>
    <div class="about-hero__content">
      <p class="label">L'artiste</p>
      <h1 class="about-hero__name" id="aboutName">Mahé Barbry</h1>
      <p class="about-hero__intro" id="aboutBio">Vit et travaille à Agen.</p>
    </div>
  </section>

  <!-- ── DÉMARCHE ── -->
  <section class="about-content">
    <div>
      <p class="label">Démarche</p>
    </div>
    <div class="about-body" id="aboutApproach">
      <p>Chargement…</p>
    </div>
  </section>

  <!-- ── EXPOSITIONS ── -->
  <section class="about-content" style="padding-top: 0; border-top: none;" id="exhibSection">
    <div>
      <p class="label">Expositions</p>
    </div>
    <div class="about-body" id="aboutExhibitions">
      <p>Chargement…</p>
    </div>
  </section>

  <script type="module">
    import { getAbout } from './js/content.js';
    const d = await getAbout();
    document.getElementById('aboutName').textContent = d.name;
    document.getElementById('aboutBio').textContent = d.bio_short;
    if (d.portrait) document.getElementById('aboutPortrait').src = d.portrait;

    const approachEl = document.getElementById('aboutApproach');
    approachEl.innerHTML = d.approach.split('\n\n').filter(Boolean)
      .map(p => `<p>${p}</p>`).join('');
    if (d.quote) {
      approachEl.innerHTML += `<p class="pull" style="margin-top:16px;">« ${d.quote} »</p>`;
    }

    const exhibEl = document.getElementById('aboutExhibitions');
    if (d.exhibitions && d.exhibitions.length && d.exhibitions[0] !== 'À compléter') {
      exhibEl.innerHTML = '<p>' + d.exhibitions.map(e => `— ${e}`).join('<br>') + '</p>';
    } else {
      exhibEl.innerHTML = '<p style="color:var(--sand);">À venir.</p>';
    }
    exhibEl.innerHTML += `<p style="margin-top:8px;"><a href="contact.html" class="link-arrow">Me contacter pour d'autres informations</a></p>`;
  </script>

  <!-- ── FOOTER ── -->
  <footer class="footer">
    <div class="footer__inner">
      <span class="footer__name">Mahé Barbry</span>
      <nav class="footer__nav">
        <a href="galerie.html">Œuvres</a>
        <a href="a-propos.html">À propos</a>
        <a href="contact.html">Contact</a>
      </nav>
      <span class="footer__copy">© 2025 Mahé Barbry · <a href="/admin/" style="opacity:.4;font-size:.85em;">Admin</a></span>
    </div>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
